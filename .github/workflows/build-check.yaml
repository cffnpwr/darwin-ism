name: Build check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Detect relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - "**/*.swift"
              - "**/*.nix"
              - "**/flake.nix"
              - "**/flake.lock"
              - "**/Package.swift"
              - "**/Package.resolved"

  build:
    name: Build (${{ matrix.system }})
    # DeterminateNix does not support x86_64-darwin natively.
    # Use aarch64-darwin runner with Rosetta 2 to build for x86_64-darwin.
    runs-on: macos-15
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.should-build == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - x86_64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.cffnpwr.dev
            extra-trusted-public-keys = cffnpwr-nixpkgs-extras:dmp2DUGwdqawLCPOsOcRxU/NpCO/qA1jha/8rmoSzvA=

      - name: Build
        run: nix build --print-build-logs --system ${{ matrix.system }}
